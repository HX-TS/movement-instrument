<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lalamove Tracking Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: white;
    }

    /* =====================================================
       TOP HEADER
    ===================================================== */

    .header {
      height: 58px;
      background: #171717;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid #333;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 12px;
      color: #aaa;
    }

    .refresh-all {
      border: 1px solid #555;
      background: #242424;
      color: white;
      padding: 7px 14px;
      border-radius: 5px;
      cursor: pointer;
    }

    .refresh-all:hover {
      background: #333;
    }


    /* =====================================================
       MAIN DASHBOARD
    ===================================================== */

    .dashboard {
      height: calc(100vh - 58px);

      display: grid;

      /* 3 WINDOWS SIDE BY SIDE */
      grid-template-columns: repeat(3, 1fr);

      gap: 5px;
      padding: 5px;
      background: #080808;
    }


    /* =====================================================
       WINDOW
    ===================================================== */

    .window {
      min-width: 0;
      height: 100%;

      background: #181818;

      border: 1px solid #333;
      border-radius: 7px;

      overflow: hidden;

      display: flex;
      flex-direction: column;
    }


    /* =====================================================
       WINDOW HEADER
    ===================================================== */

    .window-header {
      height: 55px;
      min-height: 55px;

      background: #202020;
      border-bottom: 1px solid #333;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 12px;
    }

    .window-info {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      min-width: 10px;

      border-radius: 50%;

      background: #39d353;

      box-shadow: 0 0 7px #39d353;
    }

    .window-title {
      font-size: 14px;
      font-weight: bold;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .window-subtitle {
      margin-top: 3px;

      color: #888;

      font-size: 10px;
    }

    .window-buttons {
      display: flex;
      gap: 5px;
    }

    .window-button {
      padding: 6px 8px;

      border: 1px solid #444;

      background: #292929;

      color: white;

      border-radius: 4px;

      cursor: pointer;

      font-size: 11px;
    }

    .window-button:hover {
      background: #3b3b3b;
    }


    /* =====================================================
       IFRAME
    ===================================================== */

    .frame-container {
      position: relative;

      flex: 1;

      background: white;
    }

    iframe {
      width: 100%;
      height: 100%;

      border: none;

      background: white;
    }


    /* =====================================================
       MOBILE / SMALL SCREEN
    ===================================================== */

    @media (max-width: 1000px) {

      body {
        overflow: auto;
      }

      .header {
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .dashboard {
        height: auto;
        min-height: calc(100vh - 58px);

        grid-template-columns: 1fr;
      }

      .window {
        height: 650px;
      }
    }


    @media (max-width: 600px) {

      .header {
        padding: 0 10px;
      }

      .header-title {
        font-size: 14px;
      }

      .header-right span {
        display: none;
      }

      .refresh-all {
        padding: 6px 10px;
      }

      .window {
        height: 600px;
      }
    }

  </style>
</head>


<body>


  <!-- =====================================================
       MAIN HEADER
  ====================================================== -->

  <div class="header">

    <div class="header-title">
      LALAMOVE TRACKING
    </div>

    <div class="header-right">

      <span>
        Auto Refresh:
        <strong>60 sec</strong>
      </span>

      <button
        class="refresh-all"
        onclick="refreshAll()">

        ↻ Refresh All

      </button>

    </div>

  </div>



  <!-- =====================================================
       DASHBOARD
  ====================================================== -->

  <div class="dashboard">


    <!-- =================================================
         WINDOW 1
         CRYOFLEET
    ================================================== -->

    <div class="window">

      <div class="window-header">

        <div class="window-info">

          <div class="status-dot"></div>

          <div>

            <div class="window-title">
              CRYOFLEET
            </div>

            <div class="window-subtitle">
              Lalamove Live Tracking
            </div>

          </div>

        </div>


        <div class="window-buttons">

          <button
            class="window-button"
            title="Refresh"
            onclick="refreshFrame('cryofleet')">

            ↻

          </button>


          <button
            class="window-button"
            title="Open in new tab"
            onclick="openCryofleet()">

            ↗

          </button>

        </div>

      </div>



      <div class="frame-container">

        <iframe
          id="cryofleet"

          src="https://share.lalamove.com/?MY100260819112756959410010096388787&lang=en_MY&sign=fa4cff030cd65decc4e2f08cb92e010e&source=android"

          allow="geolocation">

        </iframe>

      </div>

    </div>



    <!-- =================================================
         WINDOW 2
         PETROCAL
    ================================================== -->

    <div class="window">

      <div class="window-header">

        <div class="window-info">

          <div class="status-dot"></div>

          <div>

            <div class="window-title">
              PETROCAL
            </div>

            <div class="window-subtitle">
              Lalamove Live Tracking
            </div>

          </div>

        </div>


        <div class="window-buttons">

          <button
            class="window-button"
            title="Refresh"
            onclick="refreshFrame('petrocal1')">

            ↻

          </button>


          <button
            class="window-button"
            title="Open in new tab"
            onclick="openPetrocal1()">

            ↗

          </button>

        </div>

      </div>



      <div class="frame-container">

        <iframe
          id="petrocal1"

          src="https://share.lalamove.com/?MY100260819115508237410010096251754&lang=en_MY&sign=26d4c8b15f6cc788f148a4c31b55111d&source=android"

          allow="geolocation">

        </iframe>

      </div>

    </div>



    <!-- =================================================
         WINDOW 3
         PETROCAL
    ================================================== -->

    <div class="window">

      <div class="window-header">

        <div class="window-info">

          <div class="status-dot"></div>

          <div>

            <div class="window-title">
              PETROCAL
            </div>

            <div class="window-subtitle">
              Lalamove Live Tracking
            </div>

          </div>

        </div>


        <div class="window-buttons">

          <button
            class="window-button"
            title="Refresh"
            onclick="refreshFrame('petrocal2')">

            ↻

          </button>


          <button
            class="window-button"
            title="Open in new tab"
            onclick="openPetrocal2()">

            ↗

          </button>

        </div>

      </div>



      <div class="frame-container">

        <iframe
          id="petrocal2"

          src="https://share.lalamove.com/?MY100260819155759517410010063537331&lang=en_MY&sign=5f1683fdf5c077212724ebbe967f1e3f&source=android"

          allow="geolocation">

        </iframe>

      </div>

    </div>


  </div>



  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>

    /* =====================================================
       TRACKING LINKS
    ===================================================== */

    const cryofleetURL =
      "https://share.lalamove.com/?MY100260819112756959410010096388787&lang=en_MY&sign=fa4cff030cd65decc4e2f08cb92e010e&source=android";


    const petrocal1URL =
      "https://share.lalamove.com/?MY100260819115508237410010096251754&lang=en_MY&sign=26d4c8b15f6cc788f148a4c31b55111d&source=android";


    const petrocal2URL =
      "https://share.lalamove.com/?MY100260819155759517410010063537331&lang=en_MY&sign=5f1683fdf5c077212724ebbe967f1e3f&source=android";



    /* =====================================================
       REFRESH INDIVIDUAL WINDOW
    ===================================================== */

    function refreshFrame(id) {

      const frame = document.getElementById(id);

      if (frame) {

        const currentURL = frame.src;

        frame.src = "";

        setTimeout(function () {

          frame.src = currentURL;

        }, 100);

      }

    }



    /* =====================================================
       REFRESH ALL 3 WINDOWS
    ===================================================== */

    function refreshAll() {

      document.getElementById("cryofleet").src =
        cryofleetURL;


      document.getElementById("petrocal1").src =
        petrocal1URL;


      document.getElementById("petrocal2").src =
        petrocal2URL;

    }



    /* =====================================================
       OPEN WINDOW 1
    ===================================================== */

    function openCryofleet() {

      window.open(
        cryofleetURL,
        "_blank"
      );

    }



    /* =====================================================
       OPEN WINDOW 2
    ===================================================== */

    function openPetrocal1() {

      window.open(
        petrocal1URL,
        "_blank"
      );

    }



    /* =====================================================
       OPEN WINDOW 3
    ===================================================== */

    function openPetrocal2() {

      window.open(
        petrocal2URL,
        "_blank"
      );

    }



    /* =====================================================
       AUTO REFRESH

       60000 ms = 60 seconds
    ===================================================== */

    setInterval(
      refreshAll,
      60000
    );

  </script>


</body>
</html>
